<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content='width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes' />
    <title>Unity WebGL Player | WebGL-FirstTest</title>
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

    <style>
        /* Hide any dynamically added select dropdowns */
        select, #cameraSelector, select#cameraSelector {
            display: none !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100vw;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background-color: #111;
            color: #fff;
            position: relative; /* Needed for absolute positioning inside */
        }

        .ctaDiv {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 99;
            text-align: center;
            padding: 20px;
        }

        .ctaDiv p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .ctaDiv button {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: red;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 80%;
            max-width: 280px;
        }

        .ctaDiv button:hover {
            background-color: white;
            color: black;
        }

        #unity-container {
            position: relative;
            width: 100%;
            height: 100vh; /* Fill the viewport height */
        }

        canvas#unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: transparent;
            z-index: -1;
        }

        #unity-loading-bar {
            position: absolute;
            bottom: 30px; /* Keep it at the bottom */
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 400px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            z-index: 10; /* Make sure it's above the canvas */
        }

        #unity-progress-bar-full {
            width: 0;
            height: 100%;
            background-color: #1e90ff;
            transition: width 0.3s ease;
        }

        #unity-logo {
            display: none;
        }

        @media (max-width: 600px) {
            .ctaDiv p {
                font-size: 1rem;
            }

            .ctaDiv button {
                font-size: 0.95rem;
                padding: 10px 16px;
            }

            #unity-loading-bar {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <script src="app.js" type="text/javascript"></script>

    <div id="startWebcamDiv" class="ctaDiv">
        <p>This augmented reality experience requires access to your device's camera</p>
        <button id="startCameraBtn" onclick="StartCamera()">ALLOW ACCESS</button>
    </div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>

    <script src="Build/WEBGL_AR.loader.js"></script>
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
        }

        function StartCamera() {
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";

            document.getElementById("startWebcamDiv").style.display = "none";

            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: "Build/WEBGL_AR.data",
                frameworkUrl: "Build/WEBGL_AR.framework.js",
                codeUrl: "Build/WEBGL_AR.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DefaultCompany",
                productName: "WebGL-FirstTest",
                productVersion: "0.1.0",
            }, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                window.gameInstance = unityInstance;
                window.unityInstance = unityInstance;

                if (window.iTracker && typeof window.iTracker.startWebcam === 'function') {
                    window.iTracker.startWebcam();
                } else {
                    console.warn("iTracker.startWebcam() not available");
                }

                window.waitForVideo = () => {
                    setTimeout(() => {
                        if (!window.iTracker.VIDEO) {
                            window.waitForVideo();
                        } else if (window.iTracker.VIDEO.currentTime <= 0) {
                            // Optional fallback if video fails to start
                        }
                    }, 2500);
                };
                window.waitForVideo();

                loadingBar.style.display = "none";
            });

            loadingBar.style.display = "block";
        }
    </script>
</body>
</html>
